<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="pigPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#pigGrad)" stroke="#fef08a" stroke-width="2"/>
  <!-- Pig Ears -->
  <polygon points="17,17 24,11 26,20" fill="url(#pigPink)"/>
  <polygon points="47,17 40,11 38,20" fill="url(#pigPink)"/>
  <!-- Pig Head -->
  <ellipse cx="32" cy="27" rx="14" ry="12" fill="url(#pigPink)"/>
  <!-- Eyes -->
  <circle cx="26" cy="24" r="2" fill="#1e1b4b"/>
  <circle cx="38" cy="24" r="2" fill="#1e1b4b"/>
  <!-- Snout -->
  <ellipse cx="32" cy="30" rx="7" ry="5" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1.2"/>
  <circle cx="29.5" cy="30" r="1.3" fill="#831843"/>
  <circle cx="34.5" cy="30" r="1.3" fill="#831843"/>
  <!-- Brand Banner -->
  <rect x="8" y="42" width="48" height="15" rx="4" fill="#fef08a" stroke="#831843" stroke-width="1"/>
  <text x="32" y="53" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#831843" text-anchor="middle" letter-spacing="0.5">PIG OUT</text>
</svg>
