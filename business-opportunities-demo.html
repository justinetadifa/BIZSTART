        catalogOpen ? React.createElement('div', {

              'Bakery & Pastry Shop', 'Affordable Eatery / Casual Dining', 'Convenience Store',

              'Printing & Document Services', 'School Supplies & Stationery', 'Salon & Barbershop',

              'Appliance & Electronics Repair', 'Motorcycle Repair & Parts', 'Boutique Hotel / Pension House',
              'Coworking Space & Hotdesking', 'Tour Booking & Information Counter'
            ].map(name => React.createElement('div', {
              key: name,
              className: 'p-3 bg-slate-50 border border-slate-200 rounded-lg font-medium text-slate-800'
            }, name))),
            React.createElement('button', {
              key: 'done',
              onClick: () => setCatalogOpen(false),
              className: 'w-full py-2.5 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800 transition-colors'
            }, 'Close Catalog')
          ])
        ]) : null
      ]);
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(BusinessOpportunitiesApp));
  </script>
