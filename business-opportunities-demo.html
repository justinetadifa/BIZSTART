<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Commercial Lot | Business Opportunities Prototype (Picture 2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/business-opportunities.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 48px;
    }

    .prototype-canvas {
      width: 100%;
      max-width: 1180px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px 32px 36px;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
      position: relative;
    }

    /* Top Navigation and Header Row matching Picture 2 */
    .prototype-top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .prototype-left-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .prototype-back-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #18181b;
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 4px;
      transition: transform 0.15s ease, background-color 0.15s ease;
      text-decoration: none;
    }

    .prototype-back-circle-btn:hover {
      background: #000000;
      transform: scale(1.06);
    }

    .prototype-title-group h1 {
      font-family: 'Poppins', sans-serif;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 32px;
      line-height: 1.1;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .prototype-title-group p {
      font-size: 14.5px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 500;
    }

    .prototype-right-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Navy / Bright Red Toggle Pill */
    .prototype-view-pill-capsule {
      display: inline-flex;
      align-items: center;
      background: #11224D;
      border: 1px solid #0b1736;
      border-radius: 9999px;
      padding: 3.5px 5px;
      box-shadow: 0 2px 8px rgba(17, 34, 77, 0.25);
    }

    .prototype-toggle-btn {
      background: transparent;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 6px 16px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .prototype-toggle-btn.is-active {
      background: #E11D48;
      color: #ffffff;
      font-style: italic;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(225, 29, 72, 0.4);
    }

    /* Warning Badge on top right */
    .prototype-alert-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #fbbf24;
      color: #78350f;
      border-radius: 50%;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="prototype-canvas">
    <!-- Top Bar matching Picture 2 -->
    <header class="prototype-top-bar">
      <div class="prototype-left-header">
        <a href="property-details.php?id=10" class="prototype-back-circle-btn" aria-label="Go back to live property">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <div class="prototype-title-group">
          <h1>SAMPLE COMMERCIAL LOT</h1>
          <p>Location and listing details appear here.</p>
        </div>
      </div>

      <div class="prototype-right-controls">
        <div class="prototype-view-pill-capsule" role="group" aria-label="View toggle">
          <button type="button" class="prototype-toggle-btn" id="btnBasic">Basic</button>
          <button type="button" class="prototype-toggle-btn is-active" id="btnAdvance">Advance</button>
        </div>
        <div class="prototype-alert-badge" title="Exploratory unvalidated notice">!</div>
      </div>
    </header>

    <!-- Mount Point for the Split-Screen Business Opportunities Interface -->
    <div id="opportunitiesMount"></div>
  </div>

  <script type="module">
    import { businessOpportunitiesMarkup, initBusinessOpportunities } from './assets/js/business-opportunities.js';

    const sampleProperty = {
      id: 10,
      name: 'Sample Commercial Lot',
      lat: 16.6159,
      lng: 120.3209,
      area: 0.05,
      clupProfile: { zoningClassification: 'General Commercial' },
      utilities: ['electricity', 'water', 'telecom'],
      nearbyBusinesses: [
        { id: '1', name: 'Hospital nearby', categoryKey: 'hospital', categoryGroup: 'civic', distanceMeters: 180, lat: 16.617, lng: 120.319 },
        { id: '2', name: 'School nearby', categoryKey: 'school', categoryGroup: 'education', distanceMeters: 240, lat: 16.616, lng: 120.322 },
        { id: '3', name: 'City hall nearby', categoryKey: 'townhall', categoryGroup: 'civic', distanceMeters: 310, lat: 16.614, lng: 120.321 }
      ]
    };

    const mount = document.getElementById('opportunitiesMount');
    mount.innerHTML = businessOpportunitiesMarkup(sampleProperty);
    initBusinessOpportunities(mount);

    // Toggle interaction for demo
    const btnBasic = document.getElementById('btnBasic');
    const btnAdvance = document.getElementById('btnAdvance');
    btnBasic.addEventListener('click', () => {
      btnBasic.classList.add('is-active');
      btnAdvance.classList.remove('is-active');
      mount.style.display = 'none';
    });
    btnAdvance.addEventListener('click', () => {
      btnAdvance.classList.add('is-active');
      btnBasic.classList.remove('is-active');
      mount.style.display = 'block';
    });
  </script>
</body>
</html>
