<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
  <title id="title">Hardware and Construction Supply Vote Option</title>
  <desc id="desc">A stylized card illustration representing hardware supplies, construction materials, and trade depot operations.</desc>
  <defs>
    <linearGradient id="hardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="28" fill="url(#hardBg)"/>
  <rect x="42" y="34" width="236" height="152" rx="26" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Construction Safety Hard Hat Helmet -->
  <path d="M118 106 C118 72 202 72 202 106 Z" fill="url(#helmetGrad)"/>
  <rect x="110" y="104" width="100" height="8" rx="4" fill="#b45309"/>
  <!-- Helmet Center Ridge -->
  <path d="M154 74 L166 74 L166 104 L154 104 Z" fill="#f59e0b"/>

  <!-- Crossed Hammer & Wrench Below Helmet -->
  <!-- Claw Hammer (Diagonal Left to Right) -->
  <line x1="108" y1="148" x2="152" y2="106" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <!-- Hammer Head -->
  <path d="M144 100 L160 114 L152 122 L136 108 Z" fill="#334155"/>
  <rect x="106" y="142" width="12" height="8" rx="2" fill="#ea580c" transform="rotate(-45 106 142)"/>

  <!-- Wrench / Spanner (Diagonal Right to Left) -->
  <line x1="212" y1="148" x2="168" y2="106" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <!-- Wrench Open Head -->
  <circle cx="174" cy="112" r="8" fill="none" stroke="#334155" stroke-width="4"/>
  <rect x="206" y="142" width="12" height="8" rx="2" fill="#ea580c" transform="rotate(45 206 142)"/>

  <!-- Geometric Brick Accent Lines -->
  <rect x="74" y="52" width="22" height="8" rx="1.5" fill="#fed7aa"/>
  <rect x="100" y="52" width="22" height="8" rx="1.5" fill="#fed7aa"/>
  <rect x="224" y="52" width="22" height="8" rx="1.5" fill="#fed7aa"/>
  <rect x="198" y="52" width="22" height="8" rx="1.5" fill="#fed7aa"/>

  <!-- Card Label -->
  <text x="160" y="180" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="2.5" fill="#92400e">HARDWARE &amp; SUPPLY</text>
</svg>
