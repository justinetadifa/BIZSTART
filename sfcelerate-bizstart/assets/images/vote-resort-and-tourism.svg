<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
  <title id="title">Resort and Tourism Vote Option</title>
  <desc id="desc">A stylized card illustration representing resort and beachfront tourism development.</desc>
  <defs>
    <linearGradient id="resortBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="28" fill="url(#resortBg)"/>
  <rect x="42" y="34" width="236" height="152" rx="26" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- Sun -->
  <circle cx="160" cy="86" r="28" fill="url(#sunGrad)"/>

  <!-- Resort Waves -->
  <path d="M72 136 c20 -8 40 8 60 0 s40 -8 60 0 s40 8 56 0 v14 H72 Z" fill="url(#seaGrad)"/>
  <path d="M72 144 c22 -6 44 6 66 0 s44 -6 66 0 s44 6 44 0 v8 H72 Z" fill="#0369a1"/>

  <!-- Left Palm Tree -->
  <path d="M102 140 Q112 105 106 78" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Fronds -->
  <path d="M106 78 Q90 68 76 76" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <path d="M106 78 Q100 58 88 56" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <path d="M106 78 Q118 60 126 62" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
  <path d="M106 78 Q122 72 128 84" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>

  <!-- Beach Umbrella on Right -->
  <path d="M214 140 L214 104" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 104 Q214 86 232 104 Z" fill="#ef4444"/>
  <path d="M205 104 Q214 88 223 104 Z" fill="#ffffff"/>

  <!-- Card Label -->
  <text x="160" y="180" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#0369a1">RESORT &amp; TOURISM</text>
</svg>
