<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Investor View Toggle (Dark Navy + Red Active Pill) | LOCUS-SF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
  <!-- Load React & Framer Motion via ESM Import Map -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.9?deps=react@18.2.0,react-dom@18.2.0"
    }
  }
  </script>
</head>
<body class="bg-[#F8FAFC] text-[#11224D] min-h-screen antialiased flex flex-col justify-between">
  <div id="root"></div>

  <script type="module">
    import React, { useState } from 'react';
    import ReactDOM from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';

    /**
     * Solid 'Anti-Gravity' Spring Transition Physics
     */
    const SPRING_TRANSITION = {
      type: 'spring',
      stiffness: 500,
      damping: 35,
    };

    /**
     * Modern React InvestorViewToggle Component
     * Dark Navy Capsule Container with Vibrant Red Sliding Active Pill (Image 2)
     */
    function InvestorViewToggle({
      value,
      defaultValue = 'Basic',
      onChange,
      options = ['Basic', 'Advance'],
      className = '',
      layoutId = 'demoActiveTogglePill',
      size = 'md',
      variant = 'dark-red',
    }) {
      const [internalMode, setInternalMode] = useState(defaultValue);
      const activeMode = value !== undefined ? value : internalMode;

      const handleSelect = (mode) => {
        if (mode === activeMode) return;
        if (value === undefined) setInternalMode(mode);
        onChange?.(mode);
      };

      const isDarkRed = variant === 'dark-red';

      return (
        <div
          role="radiogroup"
          aria-label="Investor view mode"
          className={`
            inline-flex items-center gap-0 select-none
            ${isDarkRed ? 'bg-[#11224D] border border-[#0d1b3e] rounded-full p-1 shadow-[0_4px_14px_rgba(17,34,77,0.3)]' : 'bg-[#F1F3F7] border border-[#E2E6EE] rounded-[14px] p-1 shadow-sm'}
            ${className}
          `}
        >
          {options.map((option) => {
            const isActive = option === activeMode;

            return (
              <button
                key={option}
                type="button"
                role="radio"
                aria-checked={isActive}
                onClick={() => handleSelect(option)}
                className={`
                  relative px-5 py-2 text-xs sm:text-sm font-bold tracking-tight
                  transition-all duration-200 ease-out min-h-[38px] rounded-full
                  outline-none
                  ${isDarkRed ? (
                    isActive
                      ? 'text-white font-black italic drop-shadow-[0_1px_2px_rgba(0,0,0,0.35)]'
                      : 'text-white/90 hover:text-white font-bold'
                  ) : (
                    isActive
                      ? 'text-white font-bold'
                      : 'text-[#5A6578] hover:text-[#11224D] font-semibold'
                  )}
                `}
              >
                {/* Solid 'Anti-Gravity' Animated Background Pill */}
                {isActive && (
                  <motion.div
                    layoutId={layoutId}
                    transition={SPRING_TRANSITION}
                    className={`
                      absolute inset-0 z-0 pointer-events-none rounded-full
                      ${isDarkRed ? 'bg-gradient-to-r from-[#FF1A4B] to-[#D90429] shadow-[0_2px_10px_rgba(217,4,41,0.5)]' : 'bg-[#11224D] shadow-[0_2px_6px_rgba(17,34,77,0.22)]'}
                    `}
                  />
                )}

                {/* Text Label Strictly Positioned Over Background */}
                <span className="relative z-10 block pointer-events-none font-['Montserrat',sans-serif]">
                  {option}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    /**
     * Interactive Showcase App
     */
    function App() {
      const [mode, setMode] = useState('Advance');

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8">
          {/* Header */}
          <header className="max-w-4xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-4 py-4 px-6 bg-white rounded-2xl border border-slate-200/80 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-[#11224D] text-white flex items-center justify-center font-black text-sm tracking-tight shadow-sm">
                LOCUS
              </div>
              <div>
                <div className="text-sm font-bold text-slate-900 tracking-tight">
                  Investor View Toggle <span className="text-rose-600 font-semibold">(Dark Navy + Red Active Pill)</span>
                </div>
                <div className="text-xs text-slate-500">San Fernando, La Union</div>
              </div>
            </div>

            {/* Toggle in Header */}
            <div className="flex items-center gap-3">
              <span className="text-xs font-semibold text-slate-500 hidden sm:inline">
                Investor view:
              </span>
              <InvestorViewToggle
                value={mode}
                onChange={setMode}
                options={['Basic', 'Advance']}
                variant="dark-red"
              />
            </div>
          </header>

          {/* Main Visual Comparison */}
          <main className="max-w-4xl mx-auto w-full my-8 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Target Design: Dark Navy + Red Active Pill (Image 2) */}
              <div className="p-6 rounded-2xl bg-white border-2 border-rose-200/80 shadow-md flex flex-col items-center text-center">
                <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider mb-2">
                  Live Style (Image 2 Target)
                </span>
                <p className="text-xs text-slate-500 mb-6 max-w-xs">
                  Dark Navy pill container with bright Red sliding active pill, crisp white text, and signature italic active font.
                </p>

                {/* Interactive dark-red toggle */}
                <InvestorViewToggle
                  value={mode}
                  onChange={setMode}
                  options={['Basic', 'Advance']}
                  variant="dark-red"
                  layoutId="targetPillDemo"
                />
              </div>

              {/* Minimalist Light Variant (Image 1) */}
              <div className="p-6 rounded-2xl bg-white border border-slate-200/80 shadow-sm flex flex-col items-center text-center">
                <span className="text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-2">
                  Minimalist Light Theme (Image 1)
                </span>
                <p className="text-xs text-slate-500 mb-6 max-w-xs">
                  Light grayish-white container with solid dark navy sliding pill and muted inactive text.
                </p>

                {/* Interactive minimal-light toggle */}
                <InvestorViewToggle
                  value={mode === 'Advance' ? 'Advanced' : 'Basic'}
                  onChange={(m) => setMode(m === 'Advanced' ? 'Advance' : 'Basic')}
                  options={['Basic', 'Advanced']}
                  variant="minimal-light"
                  layoutId="lightPillDemo"
                />
              </div>
            </div>

            {/* Interactive State Demo */}
            <div className="p-6 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm">
              <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                <div>
                  <span className="text-xs font-semibold text-slate-400">Current View State:</span>
                  <h2 className="text-lg font-bold text-slate-900 mt-0.5">
                    {mode === 'Basic' ? 'Basic View (Essential Listing Data)' : 'Advance Mode (Analytical Assessment Unlocked)'}
                  </h2>
                </div>
                <span className="text-xs px-3 py-1 rounded-full bg-[#11224D] font-bold text-white">
                  {mode}
                </span>
              </div>

              <div className="mt-6">
                <AnimatePresence mode="wait">
                  {mode === 'Basic' ? (
                    <motion.div
                      key="basic"
                      initial={{ opacity: 0, y: 6 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -6 }}
                      transition={{ duration: 0.15 }}
                      className="p-4 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600 leading-relaxed"
                    >
                      <strong className="text-slate-800 block mb-1">Streamlined Essentials Mode</strong>
                      Presents verified property boundaries, price/sqm, listing photos, utilities, and direct broker contact. Highly accessible for initial property browsing.
                    </motion.div>
                  ) : (
                    <motion.div
                      key="advanced"
                      initial={{ opacity: 0, y: 6 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -6 }}
                      transition={{ duration: 0.15 }}
                      className="p-4 rounded-xl bg-rose-50/50 border border-rose-100 text-xs text-slate-700 leading-relaxed"
                    >
                      <strong className="text-rose-700 block mb-1">Analytical Investment Mode</strong>
                      Displays 7-criterion MCE weighted evaluation, Investment Alignment Index (IAI), 500m straight-line screening radar, and traceable business opportunities matching.
                    </motion.div>
                  )}
                </AnimatePresence>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="text-center text-xs text-slate-400 py-4">
            LOCUS-SF &middot; React 18 + Tailwind CSS + Framer Motion &middot; Anti-Gravity Spring Physics
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
