<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Investor View Toggle (Tailwind + Framer Motion) | LOCUS-SF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
  <!-- Load React & Framer Motion via ESM Import Map -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.9?deps=react@18.2.0,react-dom@18.2.0"
    }
  }
  </script>
</head>
<body class="bg-[#F8FAFC] text-[#11224D] min-h-screen antialiased flex flex-col justify-between">
  <div id="root"></div>

  <script type="module">
    import React, { useState } from 'react';
    import ReactDOM from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';

    /**
     * Solid 'Anti-Gravity' Spring Transition Physics
     */
    const SPRING_TRANSITION = {
      type: 'spring',
      stiffness: 500,
      damping: 35,
    };

    /**
     * Modern React InvestorViewToggle Component
     */
    function InvestorViewToggle({
      value,
      defaultValue = 'Basic',
      onChange,
      options = ['Basic', 'Advanced'],
      className = '',
      layoutId = 'demoActiveTogglePill',
      size = 'md',
    }) {
      const [internalMode, setInternalMode] = useState(defaultValue);
      const activeMode = value !== undefined ? value : internalMode;

      const handleSelect = (mode) => {
        if (mode === activeMode) return;
        if (value === undefined) setInternalMode(mode);
        onChange?.(mode);
      };

      return (
        <div
          role="radiogroup"
          aria-label="Investor view mode"
          className={`
            inline-flex items-center gap-1 select-none
            bg-[#F1F3F7] border border-[#E2E6EE] shadow-[0_1px_2px_rgba(17,34,77,0.04)]
            p-1 sm:p-1.5 rounded-[14px]
            ${className}
          `}
        >
          {options.map((option) => {
            const isActive = option === activeMode;

            return (
              <button
                key={option}
                type="button"
                role="radio"
                aria-checked={isActive}
                onClick={() => handleSelect(option)}
                className={`
                  relative px-5 py-2 text-xs sm:text-sm font-semibold tracking-wide
                  transition-colors duration-200 ease-out min-h-[38px] rounded-[10px]
                  outline-none focus-visible:ring-2 focus-visible:ring-[#11224D]/30 focus-visible:ring-offset-2 focus-visible:ring-offset-[#F1F3F7]
                  ${isActive ? 'text-white' : 'text-[#5A6578] hover:text-[#11224D]'}
                `}
              >
                {/* Solid 'Anti-Gravity' Animated Background Pill */}
                {isActive && (
                  <motion.div
                    layoutId={layoutId}
                    transition={SPRING_TRANSITION}
                    className="absolute inset-0 bg-[#11224D] rounded-[10px] shadow-[0_2px_6px_rgba(17,34,77,0.22)] z-0 pointer-events-none"
                  />
                )}

                {/* Text Label Strictly Positioned Over Background */}
                <span className="relative z-10 block pointer-events-none">
                  {option}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    /**
     * Interactive Showcase App
     */
    function App() {
      const [mode, setMode] = useState('Advanced');

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 sm:p-8">
          {/* Header */}
          <header className="max-w-4xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-4 py-4 px-6 bg-white rounded-2xl border border-slate-200/80 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-[#11224D] text-white flex items-center justify-center font-black text-sm tracking-tight shadow-sm">
                LOCUS
              </div>
              <div>
                <div className="text-sm font-bold text-slate-900 tracking-tight">
                  Investor Interface <span className="text-slate-400 font-normal">/ Toggle Showcase</span>
                </div>
                <div className="text-xs text-slate-500">San Fernando, La Union</div>
              </div>
            </div>

            {/* Toggle */}
            <div className="flex items-center gap-3">
              <span className="text-xs font-semibold text-slate-500 hidden sm:inline">
                Investor view:
              </span>
              <InvestorViewToggle
                value={mode}
                onChange={setMode}
              />
            </div>
          </header>

          {/* Main Visual Comparison */}
          <main className="max-w-4xl mx-auto w-full my-8 space-y-6">
            {/* Visual Comparison: Outdated vs Modern Minimalist */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Previous Outdated Pill */}
              <div className="p-6 rounded-2xl bg-white border border-slate-200/80 shadow-sm flex flex-col items-center text-center">
                <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider mb-2">
                  Previous Outdated Design
                </span>
                <p className="text-xs text-slate-500 mb-6 max-w-xs">
                  Heavy dark navy container with bright red pill, italics, and text drop-shadows.
                </p>

                {/* Static recreation of old style */}
                <div className="inline-flex items-center p-1 rounded-full bg-[#11224D] border border-[#11224D] shadow-md">
                  <div className="px-5 py-2 text-xs font-black italic text-white" style={{ textShadow: '0 1px 2px rgba(0,0,0,0.4)' }}>
                    Basic
                  </div>
                  <div className="px-5 py-2 text-xs font-black italic text-white bg-[#E11D48] rounded-full shadow" style={{ textShadow: '0 1px 2px rgba(0,0,0,0.4)' }}>
                    Advance
                  </div>
                </div>
              </div>

              {/* Modern Minimalist React Toggle */}
              <div className="p-6 rounded-2xl bg-white border border-slate-200/80 shadow-sm flex flex-col items-center text-center">
                <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider mb-2">
                  New Modern React Component
                </span>
                <p className="text-xs text-slate-500 mb-6 max-w-xs">
                  Light grayish-white container, solid dark navy animated pill, muted text, no italics.
                </p>

                {/* Interactive modern toggle */}
                <InvestorViewToggle
                  value={mode}
                  onChange={setMode}
                />
              </div>
            </div>

            {/* Interactive State Demo */}
            <div className="p-6 sm:p-8 rounded-2xl bg-white border border-slate-200/80 shadow-sm">
              <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                <div>
                  <span className="text-xs font-semibold text-slate-400">Current View State:</span>
                  <h2 className="text-lg font-bold text-slate-900 mt-0.5">
                    {mode === 'Basic' ? 'Basic View (Essential Listing Data)' : 'Advanced Mode (Analytical Assessment Unlocked)'}
                  </h2>
                </div>
                <span className="text-xs px-3 py-1 rounded-full bg-slate-100 font-bold text-[#11224D]">
                  {mode}
                </span>
              </div>

              <div className="mt-6">
                <AnimatePresence mode="wait">
                  {mode === 'Basic' ? (
                    <motion.div
                      key="basic"
                      initial={{ opacity: 0, y: 6 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -6 }}
                      transition={{ duration: 0.15 }}
                      className="p-4 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600 leading-relaxed"
                    >
                      <strong className="text-slate-800 block mb-1">Streamlined Essentials Mode</strong>
                      Presents verified property boundaries, price/sqm, listing photos, utilities, and direct broker contact. Highly accessible for initial property browsing.
                    </motion.div>
                  ) : (
                    <motion.div
                      key="advanced"
                      initial={{ opacity: 0, y: 6 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -6 }}
                      transition={{ duration: 0.15 }}
                      className="p-4 rounded-xl bg-[#11224D]/5 border border-[#11224D]/15 text-xs text-slate-700 leading-relaxed"
                    >
                      <strong className="text-[#11224D] block mb-1">Analytical Investment Mode</strong>
                      Displays 7-criterion MCE weighted evaluation, Investment Alignment Index (IAI), 500m straight-line screening radar, and traceable business opportunities matching.
                    </motion.div>
                  )}
                </AnimatePresence>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="text-center text-xs text-slate-400 py-4">
            LOCUS-SF &middot; React 18 + Tailwind CSS + Framer Motion &middot; Anti-Gravity Spring Physics
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
